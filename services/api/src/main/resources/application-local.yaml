spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/mymuse
        username: mymuse
        password: mymuse-local
    security:
        oauth2:
            client:
                registration:
                    google:
                        client-id: ${GOOGLE_CLIENT_ID:local-development-client}
                        client-secret: ${GOOGLE_CLIENT_SECRET:local-development-secret}
                    kakao:
                        client-id: ${KAKAO_REST_API_KEY:local-development-client}
                        client-secret: ${KAKAO_CLIENT_SECRET:local-development-secret}
                        client-authentication-method: client_secret_post
                        authorization-grant-type: authorization_code
                        redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
                        scope:
                            - profile_nickname
                            - account_email
                        client-name: Kakao
                provider:
                    kakao:
                        authorization-uri: https://kauth.kakao.com/oauth/authorize
                        token-uri: https://kauth.kakao.com/oauth/token
                        user-info-uri: https://kapi.kakao.com/v2/user/me
                        user-name-attribute: id
