name: mymuse-api-local

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: mymuse
      POSTGRES_USER: mymuse
      POSTGRES_PASSWORD: mymuse-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mymuse -d mymuse"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  postgres-data:
